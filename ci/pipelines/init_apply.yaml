---
trigger: none
pr: none

resources:
  pipelines:
    - pipeline: _source-pipeline
      source: yaml-pipelines\epiphany-platform.epiphany [build]

pool:
  name: $(agentPoolName)

variables:
  image_tag: $(Build.SourceBranch).$(resources.pipeline._source-pipeline.runId)
  cluster_name: testawsinitfull
  repository: epicli
  BRANCH_NAMEXXX: $[replace(variables['resources.pipeline._source-pipeline.sourceBranch'], 'refs/heads/', '')]

stages:
- stage: DeployAWS
  jobs:
    - job: Deploy
      steps:
#        - checkout: none
        - task: DownloadPipelineArtifact@2
          displayName: 'Download Pipeline Artifact'
          inputs:
            buildType: 'specific'
            project: 'epiphany'
            definition: 142

        - task: Bash@3
          displayName: Print BuildId
          inputs:
            targetType: inline
            script: |
              printenv
              echo $(resources.pipeline._source-pipeline.runId)
              echo $(resources.pipeline._source-pipeline.sourceBranch)
              echo $(Build.SourceBranch)
              echo $(image_tag)
              echo $(Release.Artifacts)

        - task: Bash@3
          displayName: Install aws cli
          inputs:
            targetType: inline
            script: |
              apt-get update && apt-get install awscli
        - task: Bash@3
          displayName: Check if build directory already exists
          inputs:
            targetType: inline
            script: |
              if [ -f "/build/epi-cli/build/$(cluster_name)/manifest.yml" ]; then echo "##vso[task.setvariable variable=directoryExists;]true"; fi
        - task: Docker@2
          displayName: 'Destroy environment'
          inputs:
            containerRegistry: $(containerRegistry)
            repository: $(repository)
            command: 'Run an image'
            imageName: '$(repository):$(image_tag)'
            volumes: '/tmp/build/epi-cli:/shared'
            containerCommand: '-c "cd ~ && epicli -l ~/log.log --auto-approve delete -b /shared/build/$(cluster_name)"'
            runInBackground: false
          condition: eq(variables['directoryExists'], true)

