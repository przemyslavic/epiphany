---
trigger:
  branches:
    include:
    - develop
pr:
  branches:
    include:
    - develop
    
pool:
  name: $(poolName)

variables:
  ansible_lint_error_threshold: 1500
  pylint_score_cli_threshold: 9.25
  pylint_score_tests_threshold: 9.65
  rubocop_linter_threshold: 1112

jobs:
- job: Run_linters
  displayName: Run linters
  steps:
  - task: UsePythonVersion@0
    displayName: Use Python 3.10
    inputs:
      versionSpec: 3.10
  - task: Bash@3
    displayName: Install Ansible Linter and its dependencies
    inputs:
      targetType: inline
      script: >-
        python -m pip install --upgrade pip setuptools lxml

        python -m pip install ansible ansible-lint ansible-lint-junit==0.16
  - task: Bash@3
    displayName: Run Ansible Linter
    inputs:
      targetType: inline
      script: >-
        mkdir -p linting_tests

        ansible-lint --nocolor \
                     --parseable-severity \
                     > linting_tests/ansible_lint_errors

        # Suppress the next line when the "load-failure" bug in ansible-lint is solved

        # https://github.com/ansible-community/ansible-lint/issues/1446

        sed -i '/load-failure/d' linting_tests/ansible_lint_errors


        error_count=$(wc -l linting_tests/ansible_lint_errors | awk '{ print $1 }')


        # Convert to junit

        ansible-lint-junit linting_tests/ansible_lint_errors \
                           -o linting_tests/ansible_lint_errors.xml

        test $error_count -le $(ansible_lint_error_threshold)
  - task: PublishTestResults@2
    displayName: Publish Ansible Linting Test Results
    inputs:
      testResultsFiles: ansible_lint_errors.xml
      searchFolder: $(System.DefaultWorkingDirectory)/linting_tests
      testRunTitle: Ansible Linting Test Results
  - task: Bash@3
    displayName: Install Python dependencies and its dependencies
    inputs:
      targetType: inline
      script: >
        python -m ensurepip --upgrade

        python -m pip install pylint pylint-fail-under pylint-junit
  - task: Bash@3
    displayName: Run Python Linter on CLI code
    inputs:
      targetType: inline
      script: >-
        mkdir -p linting_tests && \

        python -m pylint  ./cli  \

        --rcfile .pylintrc \

        --fail-under=$(pylint_score_cli_threshold) \

        --output linting_tests/cli_code_results.xml
  - task: PublishTestResults@2
    displayName: Publish Python Linting Test Results for CLI Code
    inputs:
      testResultsFiles: cli_code_results.xml
      searchFolder: $(System.DefaultWorkingDirectory)/linting_tests
      testRunTitle: Python Linting Test Results for CLI Code
  - task: Bash@3
    displayName: Run Python Linter on Test Code
    inputs:
      targetType: inline
      script: >-
        mkdir -p linting_tests && \

        python -m pylint ./tests  \

        --rcfile .pylintrc \

        --fail-under=$(pylint_score_tests_threshold) \

        --output linting_tests/test_code_results.xml \

        --disable=F0401 # Disable import-error checking
  - task: PublishTestResults@2
    displayName: Publish Python Linting Test Results for Test Code
    inputs:
      testResultsFiles: test_code_results.xml
      searchFolder: $(System.DefaultWorkingDirectory)/linting_tests
      testRunTitle: Python Linting Test Results for Test Code
  - task: Bash@3
    displayName: Install Rubocop and its dependencies
    inputs:
      targetType: inline
      filePath: apt-get install rubygems && \ gem install rubocop rubocop-junit_formatter
      script: >-
        apt-get update && \

        apt-get install rubygems && \

        gem install rubocop:1.28.2 rubocop-junit_formatter
  - task: Bash@3
    displayName: Run Rubocop linter on Test Code
    inputs:
      targetType: inline
      script: >-
        mkdir -p linting_tests && \

        rubocop ./tests \

        -c .rubocop.yml \

        --require rubocop/formatter/junit_formatter \

        --format RuboCop::Formatter::JUnitFormatter \

        --out linting_tests/rubocop_results.xml \

        --fail-level error
  - task: Bash@3
    displayName: Assert number of linter failures
    inputs:
      targetType: inline
      script: "# Fetch number of detected failures from results file, then test if it does not exceed the declared threshold \n# rubocop_linter_threshold is set based on latest linter results performed after code cleaning\n\nset -e \n\ndetected_failures=$( \\\n    grep --only-matching 'failures=.[0-9]*.' linting_tests/rubocop_results.xml | \\\n    grep --only-matching '[0-9]*')\n\necho \"Number of detected failures: $detected_failures\"\necho \"Failures threshold value: $(rubocop_linter_threshold)\"\n\ntest  $detected_failures -le $(rubocop_linter_threshold)\n"
  - task: PublishTestResults@2
    displayName: Publish Rubocop Linting Test Results
    condition: always()
    inputs:
      testResultsFiles: rubocop_results.xml
      searchFolder: $(System.DefaultWorkingDirectory)/linting_tests
      testRunTitle: Rubocop Test Results
