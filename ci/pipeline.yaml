---
trigger:
  branches:
    include:
    - develop
pr:
  branches:
    include:
    - develop
    
pool:
  name: $(poolName)

jobs:
- job: Run_unit_tests
  displayName: Run unit tests
  steps:
  - task: UsePythonVersion@0
    displayName: Use Python 3.10
    inputs:
      versionSpec: 3.10
  - task: Bash@3
    displayName: Install Python dependencies
    inputs:
      targetType: inline
      script: >
        python -m ensurepip --upgrade
        
        python -m pip install boto3 jinja2 jsonschema pytest python-json-logger pytest_mock pyyaml wheel setuptools twine ruamel.yaml
  - task: Bash@3
    displayName: Run unit tests
    continueOnError: true
    inputs:
      targetType: inline
      script: >-
        python -m pytest --junit-xml=tests/results/result.xml
  - task: PublishTestResults@2
    displayName: Publish Test Results
    inputs:
      testResultsFiles: '*.xml'
      searchFolder: $(System.DefaultWorkingDirectory)/tests/results
      failTaskOnFailedTests: true
      testRunTitle: Python unit tests for Epicli
- job: Build_epicli_image
  displayName: Build an epicli image
  dependsOn:
  - Run_unit_tests
  steps:
  - task: Docker@2
    displayName: Build image
    inputs:
      containerRegistry: $(containerRegistry)
      repository: epicli
      command: build
      Dockerfile: Dockerfile
      tags: $(Build.SourceBranchName).$(Build.BuildId)
  - task: Docker@2
    displayName: Push image
    inputs:
      containerRegistry: $(containerRegistry)
      repository: epicli
      command: push
      tags: $(Build.SourceBranchName).$(Build.BuildId)
